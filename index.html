<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Digital business card for David Katz - compilers, HPC, LLVM / MLIR." />
  <meta name="theme-color" content="#e8eaed" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
  <title>David Katz</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>

<body>
  <main id="main">
    <!-- The card is a real object: one piece of stock with two faces, turned
         over rather than scrolled. The checkbox is the hinge, so the flip
         works with no JavaScript and stays keyboard operable; both faces
         label it, so it carries an explicit aria-label of its own. It sits
         outside the faces because a control inside the hidden face would
         stop being focusable exactly when it is needed. -->
    <input id="turn" class="turn-input" type="checkbox" role="switch" aria-label="Turn the card over" />

    <div class="card">
      <section class="face front" aria-label="Front of card">
        <header class="ident">
          <h1>David Katz</h1>
          <p class="role">compilers · HPC · LLVM / MLIR</p>
          <p class="affil">PhD · EPCC, University of Edinburgh</p>
        </header>

        <div class="scan">
          <!-- The QR keeps fixed dark-on-light values in both schemes: it is
               tinted to the card's copper, never inverted. Plenty of phone
               cameras refuse an inverted code, and getting scanned is the
               only job this page has. -->
          <div class="die">
            <!-- @include qr -->
          </div>
          <p class="scan-label">
            <span class="key">scan</span>
            <span class="val">hi.david-katz.dev</span>
          </p>
        </div>

        <div class="foot">
          <a class="site" href="https://david-katz.dev">
            david-katz.dev
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2"
              stroke="currentColor" width="13" height="13" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg>
          </a>
          <label class="turn-tab" for="turn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
              stroke="currentColor" width="13" height="13" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M19.5 12a7.5 7.5 0 0 1-13 5.1M4.5 12a7.5 7.5 0 0 1 13-5.1M17.5 3v4h-4M6.5 21v-4h4" />
            </svg>
            contacts
          </label>
        </div>
      </section>

      <section class="face back" aria-label="Back of card">
        <!-- The reverse repeats the name the way a printed card does, set in
             the mono face rather than the display one so the two sides are
             an echo and not a duplicate. -->
        <p class="wordmark" aria-hidden="true">David Katz</p>

        <div class="reach">
          <h2 class="rail">contact</h2>

          <!-- The reverse of a card lists the addresses themselves, not just
               the platforms they live on: it has to be readable to someone
               holding it, without tapping anything. -->
          <ul class="lines">
            <li>
              <a href="mailto:dk949.david@gmail.com" class="line" aria-label="Send email to dk949.david@gmail.com">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" width="14" height="14" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                </svg>
                <span class="k">mail</span>
                <span class="v">dk949.david@gmail.com</span>
              </a>
              <button id="copy-email" aria-label="Copy email address" title="Copy email address">
                <svg class="icon-copy" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                  stroke-width="1.5" stroke="currentColor" width="13" height="13" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2" />
                </svg>
                <svg class="icon-check" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                  stroke-width="2" stroke="currentColor" width="13" height="13" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                </svg>
              </button>
              <span id="copy-status" class="sr-only" role="status"></span>
            </li>

            <li>
              <a href="https://github.com/dk949" target="_blank" rel="noopener noreferrer" class="line gh"
                aria-label="GitHub profile, dk949 (opens in new tab)">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
                  <path
                    d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12Z" />
                </svg>
                <span class="k">github</span>
                <span class="v">@dk949</span>
              </a>
            </li>

            <li>
              <a href="https://www.linkedin.com/in/dk949/" target="_blank" rel="noopener noreferrer"
                class="line linkedin" aria-label="LinkedIn profile, in/dk949 (opens in new tab)">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
                  <path
                    d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                </svg>
                <span class="k">linkedin</span>
                <span class="v">in/dk949</span>
              </a>
            </li>

            <li>
              <a href="https://orcid.org/0009-0003-7387-6169" target="_blank" rel="noopener noreferrer"
                class="line orcid" aria-label="ORCID record 0009-0003-7387-6169 (opens in new tab)">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
                  <path
                    d="M12 0C5.372 0 0 5.372 0 12s5.372 12 12 12 12-5.372 12-12S18.628 0 12 0zM7.369 4.378c.525 0 .947.431.947.947 0 .525-.422.947-.947.947a.95.95 0 0 1-.947-.947c0-.525.422-.947.947-.947zm-.722 3.038h1.444v10.041H6.647V7.416zm3.562 0h3.9c3.713 0 5.344 2.653 5.344 5.025 0 2.578-2.016 5.025-5.325 5.025h-3.919V7.416zm1.444 1.303v7.444h2.297c3.272 0 4.022-2.484 4.022-3.722 0-2.016-1.284-3.722-4.097-3.722h-2.222z" />
                </svg>
                <span class="k">orcid</span>
                <span class="v">0009-0003-7387-6169</span>
              </a>
            </li>
          </ul>
        </div>

        <a class="vcf" href="/david-katz.vcf" download="david-katz.vcf">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" width="14" height="14" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
          </svg>
          save contact
        </a>

        <div class="foot">
          <p class="mark">© 2026 David Katz</p>
          <label class="turn-tab" for="turn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
              stroke="currentColor" width="13" height="13" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M19.5 12a7.5 7.5 0 0 1-13 5.1M4.5 12a7.5 7.5 0 0 1 13-5.1M17.5 3v4h-4M6.5 21v-4h4" />
            </svg>
            front
          </label>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/src/card.ts"></script>
</body>

</html>
